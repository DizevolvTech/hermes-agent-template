# Trecho de referência para ~/.hermes/profiles/{{AGENT_SLUG}}/config.yaml — NÃO é um config completo.
# Gere o seu com `hermes setup` e ajuste só estas chaves. Secrets vão no .env.
# Confirme os nomes na sua versão: `hermes config --help` / docs oficiais.
model:
  provider: "[[PREENCHER: anthropic | openai | openrouter | nous | custom]]"
  default: "[[PREENCHER: id do modelo]]"
terminal:
  backend: local
  cwd: "/caminho/para/{{SLUG}}-casa-{{AGENT_SLUG}}"        # a casa é o diretório de trabalho do agente
