# Configuração da casa (sem secrets, sem caminhos da máquina). Lida pelos scripts, que definem $CASA antes.
SLUG="{{SLUG}}"
AGENT_SLUG="{{AGENT_SLUG}}"
CEREBRO_PATH="${CEREBRO_PATH:-$CASA/../{{SLUG}}-cerebro}"
# Agente macro: identidade mora nesta casa.
IDENTITY_SRC="$CASA"
# Perfil isolado: <raiz do Hermes>/profiles/<agente>. Funciona com HERMES_HOME apontando para a raiz,
# para o próprio perfil (quando o agente roda dentro dele) ou ausente.
_HH="${HERMES_HOME:-$HOME/.hermes}"
case "$_HH" in
  */profiles/{{AGENT_SLUG}}) HERMES_HOME="$_HH" ;;
  */profiles/*) HERMES_HOME="${_HH%/profiles/*}/profiles/{{AGENT_SLUG}}" ;;
  *) HERMES_HOME="$_HH/profiles/{{AGENT_SLUG}}" ;;
esac
